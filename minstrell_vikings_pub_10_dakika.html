<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
.wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.brand{font-family:Georgia,serif;font-weight:900;font-size:42px;letter-spacing:7px;color:#d7a64a;text-shadow:0 3px 8px #000,0 0 16px rgba(215,166,74,.45)}
.title{font-family:Georgia,serif;font-weight:900;font-size:34px;letter-spacing:4px;color:#fff;text-shadow:0 3px 8px #000;margin-top:8px}
#timer{font-family:Georgia,serif;font-weight:900;font-size:115px;letter-spacing:5px;color:#fff;text-shadow:0 5px 14px #000,0 0 20px rgba(215,166,74,.6);margin-top:2px}
#timer.last{animation:pulse .5s infinite alternate}
.done{display:none;font-family:Georgia,serif;font-weight:900;font-size:58px;letter-spacing:3px;color:#d7a64a;text-shadow:0 4px 12px #000,0 0 20px rgba(215,166,74,.7);animation:pulse .7s infinite alternate}
@keyframes pulse{from{transform:scale(1);opacity:.75}to{transform:scale(1.08);opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">MINSTRELL</div>
  <div class="title">YAYIN BAŞLIYOR</div>
  <div id="timer">10:00</div>
  <div id="done" class="done">YAYIN BAŞLIYOR!</div>
</div>
<script>
let remaining=600;
const timer=document.getElementById('timer'), done=document.getElementById('done');
function update(){
  const m=String(Math.floor(remaining/60)).padStart(2,'0');
  const s=String(remaining%60).padStart(2,'0');
  timer.textContent=`${m}:${s}`;
  if(remaining<=10 && remaining>0) timer.classList.add('last');
  if(remaining<=0){
    clearInterval(interval);
    timer.style.display='none';
    done.style.display='block';
    return;
  }
  remaining--;
}
update();
const interval=setInterval(update,1000);
</script>
</body>
</html>
